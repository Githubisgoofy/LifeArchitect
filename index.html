<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Life Architect v3.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        html, body { 
            width: 100vw; 
            height: 100vh; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div id="char-creation" class="char-creation-screen">
            <div class="char-creation-box">
                <h1>👶 Create Your Character</h1>
                <input type="text" id="char-name" placeholder="Enter your name" maxlength="20">
                
                <div class="gender-select">
                    <button class="gender-btn male-btn" onclick="ui.selectGender('Male', this)">👨 Male</button>
                    <button class="gender-btn female-btn" onclick="ui.selectGender('Female', this)">👩 Female</button>
                </div>
                
                <button class="btn-start" onclick="ui.startGame()">START LIFE</button>
                <button class="btn-start" onclick="ui.loadGame()" style="background: #667eea; margin-top: 10px;">LOAD GAME</button>
            </div>
        </div>

        <div id="game-screen" class="game-screen hidden">
        
        <div class="top-bar">
            <div class="top-info">
                <span id="header-name">Alex</span>
                <span id="header-age" class="highlight">Age: 0</span>
            </div>
            <div class="money-display" id="header-money">$0</div>
        </div>

        <div class="character-area">
            <div class="avatar-circle" id="avatar-display">👶</div>
            <div class="status-bars">
                <div class="bar-row"><span class="icon">❤️</span> <div class="track"><div id="bar-health" class="fill red"></div></div></div>
                <div class="bar-row"><span class="icon">😄</span> <div class="track"><div id="bar-happy" class="fill orange"></div></div></div>
                <div class="bar-row"><span class="icon">🧠</span> <div class="track"><div id="bar-smarts" class="fill blue"></div></div></div>
                <div class="bar-row"><span class="icon">😎</span> <div class="track"><div id="bar-looks" class="fill purple"></div></div></div>
            </div>
        </div>

        <div class="life-snapshot">
            <div class="snapshot-item">
                <span class="snapshot-label">Career</span>
                <span id="snapshot-job" class="snapshot-value">Unemployed</span>
            </div>
            <div class="snapshot-item">
                <span class="snapshot-label">Relationship</span>
                <span id="snapshot-partner" class="snapshot-value">Single</span>
            </div>
            <div class="snapshot-item compact">
                <span class="snapshot-label">Kids</span>
                <span id="snapshot-kids" class="snapshot-value">0</span>
            </div>
            <div class="snapshot-item compact">
                <span class="snapshot-label">Fame</span>
                <span id="snapshot-fame" class="snapshot-value">0</span>
            </div>
            <div class="snapshot-item">
                <span class="snapshot-label">Annual Income</span>
                <span id="snapshot-salary" class="snapshot-value">$0</span>
            </div>
            <div class="snapshot-item">
                <span class="snapshot-label">Education</span>
                <span id="snapshot-major" class="snapshot-value">Undeclared</span>
            </div>
        </div>

        <div id="game-log" class="game-log">
            <div class="log-entry">Welcome to Life Architect. Your story begins.</div>
        </div>

        <div class="controls-area">
            <div class="grid-menu">
                <button onclick="actions.school()">
                    <div class="btn-icon">📚</div>
                    <span>School</span>
                </button>
                <button onclick="actions.job()">
                    <div class="btn-icon">💼</div>
                    <span>Jobs</span>
                </button>
                <button onclick="actions.love()">
                    <div class="btn-icon">💘</div>
                    <span>Love</span>
                </button>
                <button onclick="actions.assets()">
                    <div class="btn-icon">🏠</div>
                    <span>Shop</span>
                </button>
                <button onclick="actions.activities()">
                    <div class="btn-icon">🏄</div>
                    <span>Activities</span>
                </button>
                <button onclick="actions.crime()">
                    <div class="btn-icon">😈</div>
                    <span>Crime</span>
                </button>
            </div>
            
            <button id="btn-age" class="btn-age" onclick="game.ageUp()">+ AGE UP</button>
            <button class="btn-age" onclick="ui.newGame()" style="background: linear-gradient(180deg, #ff6b6b, #ee5a52); margin-top: 5px;">NEW GAME</button>
        </div>

        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal-box">
                <h2 id="modal-title">Title</h2>
                <p id="modal-text">Description text goes here.</p>
                <div id="modal-buttons" class="modal-buttons">
                    </div>
            </div>
        </div>

        </div>

    </div>
</body>
</html>
